name: proof-cancel-race-macos
# TEMPORARY proof workflow (never merges): pi #11252 on hermes' LocalEnvironment, base vs head.
on:
  push:
    branches: ['proof/cancel-race-macos']
jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        leg: [base, head]
        runner: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up locked Python
        uses: ./.github/actions/setup-pm
        with:
          packages: 'ripgrep'
          extras: '[]'
          test-environment: 'true'
      - name: base tree
        if: matrix.leg == 'base'
        timeout-minutes: 2
        run: git show origin/main:tools/environments/local.py > tools/environments/local.py && git diff --stat
      - name: run
        timeout-minutes: 15
        env:
          TRIALS: '180'
          PARALLEL: '6'
          HERMES_HOME: ${{ runner.temp }}/hh
        run: |
          mkdir -p "$HERMES_HOME"
          scripts/run-in-hermes-env python3 scripts/proof_cancel_race.py 2>&1 | tail -5
